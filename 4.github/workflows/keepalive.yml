name: Advanced Keep Alive Ping

on:
  schedule:
    # Se ejecuta automáticamente cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Te permite ejecutarlo a mano si lo necesitas

jobs:
  advanced-ping:
    runs-on: ubuntu-latest
    steps:
      - name: 🕒 Registrar marca de tiempo
        run: echo "Ejecutando comprobación de estado el $(date)"

      - name: 🚀 Ping Avanzado a Render
        run: |
          URL="https://paltidxr-p.onrender.com/"
          echo "Iniciando conexión a: $URL"
          
          # Técnica 1: Simular un navegador real (User-Agent) para evitar bloqueos
          # Técnica 2: --max-time 10 (Se rinde si tarda más de 10 segundos)
          # Técnica 3: --retry 3 (Si falla por un microcorte, lo intenta hasta 3 veces)
          # Técnica 4: --retry-delay 5 (Espera 5 segundos entre cada reintento)
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            --retry 3 \
            --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) GitHubActions-KeepAlive/1.0" \
            "$URL")
          
          echo "========================================"
          echo "Código de respuesta HTTP recibido: $HTTP_STATUS"
          echo "========================================"
          
          # Técnica 5: Validación inteligente de estado
          # Verifica si la respuesta está en el rango de éxito (2xx o 3xx)
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ ÉXITO: El servicio está despierto y respondiendo correctamente."
          else
            echo "❌ ERROR: El servidor no respondió como se esperaba (Código: $HTTP_STATUS)."
            exit 1 # Esto hace que GitHub Actions marque el proceso en rojo para alertarte
          fi
          
